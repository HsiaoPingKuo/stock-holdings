spring.application.name=stock-holdings

# 測試用記憶體資料庫：跑測試不會在 ./data/ 產生檔案，也不會動到本機正式資料
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 外部行情：測試不可以連外網，主機指到本機不存在的服務；
# 需要模擬官方回應的測試用 MockRestServiceServer，不會用到這裡的網址
quote.twse.base-url=http://localhost:9
quote.tpex.base-url=http://localhost:9
quote.connect-timeout=1s
quote.read-timeout=1s
quote.lookup-timeout=2s
quote.lookup-cache-ttl=10m
