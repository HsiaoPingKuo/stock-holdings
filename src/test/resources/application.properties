spring.application.name=stock-holdings

# 測試用記憶體資料庫：跑測試不會在 ./data/ 產生檔案，也不會動到本機正式資料
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 外部行情：測試不可以連外網，主機指到本機不存在的服務；
# 需要模擬官方回應的測試用 MockRestServiceServer，不會用到這裡的網址
quote.twse.base-url=http://localhost:9
quote.tpex.base-url=http://localhost:9
quote.connect-timeout=1s
quote.read-timeout=1s
quote.lookup-timeout=2s
quote.request-budget=9s
quote.max-concurrent-lookups=4
quote.lookup-min-remaining=2s
quote.lookup-cache-ttl=10m
quote.holiday-url=http://localhost:9/v1/holidaySchedule/holidaySchedule
# 測試時關掉背景更新：跑測試不可以發出請求；需要測排程的測試自己建立物件、用假的 client
quote.refresh.enabled=false
quote.refresh.start-time=13:40
quote.refresh.slowdown-time=14:30
quote.refresh.end-time=15:40
quote.refresh.fast-interval=60s
quote.refresh.fast-jitter=5s
quote.refresh.slow-interval=10m
quote.refresh.per-request-delay-min=3200ms
quote.refresh.per-request-delay-max=5800ms
quote.refresh.cooldown=30m
quote.refresh.startup-lookback-days=10
quote.dividend-read-timeout=1s
