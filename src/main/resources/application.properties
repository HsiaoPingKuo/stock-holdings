spring.application.name=stock-holdings

# 埠號：預設 8080，主考官電腦被占用時可用環境變數 SERVER_PORT 改掉
server.port=${SERVER_PORT:8080}

# H2 檔案模式：資料存在專案目錄下的 ./data/，重開伺服器資料還在，也不用另外安裝資料庫
spring.datasource.url=jdbc:h2:file:./data/stockholdings
spring.datasource.username=sa
# 密碼不寫死在 repo；開發時預設空字串，需要時用環境變數 DB_PASSWORD 覆蓋
spring.datasource.password=${DB_PASSWORD:}

# 資料表一律由 Flyway migration 建立；Hibernate 只檢查 Entity 和資料表對不對得上，不自己改表
spring.jpa.hibernate.ddl-auto=validate
# 關掉 open-in-view：資料庫連線只在 service 層使用，避免畫面渲染時才偷偷查資料庫
spring.jpa.open-in-view=false