spring.application.name=stock-holdings

# session 只用 cookie 記錄，不要把 ;jsessionid=... 加在網址後面（避免網址難看、session id 外流）
server.servlet.session.tracking-modes=cookie

# 埠號：預設 8080，主考官電腦被占用時可用環境變數 SERVER_PORT 改掉
server.port=${SERVER_PORT:8080}

# H2 檔案模式：資料存在專案目錄下的 ./data/，重開伺服器資料還在，也不用另外安裝資料庫
spring.datasource.url=jdbc:h2:file:./data/stockholdings
spring.datasource.username=sa
# 密碼不寫死在 repo；開發時預設空字串，需要時用環境變數 DB_PASSWORD 覆蓋
spring.datasource.password=${DB_PASSWORD:}

# 資料表一律由 Flyway migration 建立；Hibernate 只檢查 Entity 和資料表對不對得上，不自己改表
spring.jpa.hibernate.ddl-auto=validate
# 關掉 open-in-view：資料庫連線只在 service 層使用，避免畫面渲染時才偷偷查資料庫
spring.jpa.open-in-view=false

# ===== 外部行情（第 3 題）=====
# 主機網址可用環境變數換成主考官的測試伺服器；路徑和參數寫在程式裡，不會變
quote.twse.base-url=${TWSE_BASE_URL:https://www.twse.com.tw}
quote.tpex.base-url=${TPEX_BASE_URL:https://www.tpex.org.tw}
# 每個請求：建立連線最多 3 秒、等回應最多 5 秒
quote.connect-timeout=3s
quote.read-timeout=5s
# 新增持股時同時查上市、上櫃，整體最多等 8 秒（題目要求按下新增後 10 秒內看到結果）
quote.lookup-timeout=8s
# 查過的代號記住 10 分鐘：輸入代號時的即時提示和按下新增共用結果，避免短時間重複打官方而被擋
# （只記「查到」和「確定查不到」；連不上的結果不記，下次會重查）
quote.lookup-cache-ttl=10m