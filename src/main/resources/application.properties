spring.application.name=stock-holdings

# session 只用 cookie 記錄，不要把 ;jsessionid=... 加在網址後面（避免網址難看、session id 外流）
server.servlet.session.tracking-modes=cookie

# 埠號：預設 8080，主考官電腦被占用時可用環境變數 SERVER_PORT 改掉
server.port=${SERVER_PORT:8080}

# H2 檔案模式：資料存在專案目錄下的 ./data/，重開伺服器資料還在，也不用另外安裝資料庫
spring.datasource.url=jdbc:h2:file:./data/stockholdings
spring.datasource.username=sa
# 密碼不寫死在 repo；開發時預設空字串，需要時用環境變數 DB_PASSWORD 覆蓋
spring.datasource.password=${DB_PASSWORD:}

# 資料表一律由 Flyway migration 建立；Hibernate 只檢查 Entity 和資料表對不對得上，不自己改表
spring.jpa.hibernate.ddl-auto=validate
# 關掉 open-in-view：資料庫連線只在 service 層使用，避免畫面渲染時才偷偷查資料庫
spring.jpa.open-in-view=false

# ===== 外部行情（第 3 題）=====
# 主機網址可用環境變數換成主考官的測試伺服器；路徑和參數寫在程式裡，不會變
quote.twse.base-url=${TWSE_BASE_URL:https://www.twse.com.tw}
quote.tpex.base-url=${TPEX_BASE_URL:https://www.tpex.org.tw}
# 每個請求：建立連線最多 3 秒、等回應最多 5 秒
quote.connect-timeout=3s
quote.read-timeout=5s
# 新增持股時同時查上市、上櫃，最多等 8 秒；剩下的預算（見 request-budget）比較少時，以剩下的為準
quote.lookup-timeout=8s
# 一個請求（新增持股、即時提示）的時間預算：從收到請求開始算，排隊等名額、等官方回應都算在內。
# 題目要求按下新增後 10 秒內看到結果，留 1 秒給寫入資料庫和網路傳輸
quote.request-budget=${QUOTE_REQUEST_BUDGET:9s}
# 同時查官方的代號數上限：官方很慢時，不會讓大量請求一起卡住；等不到名額就回「暫時無法確認」
quote.max-concurrent-lookups=${QUOTE_MAX_CONCURRENT_LOOKUPS:4}
# 剩下的預算少於這個值就不查官方（查了也來不及），直接回「暫時無法確認」
quote.lookup-min-remaining=${QUOTE_LOOKUP_MIN_REMAINING:2s}
# 查過的代號記住 10 分鐘：輸入代號時的即時提示和按下新增共用結果，避免短時間重複打官方而被擋
# （只記「查到」和「確定查不到」；連不上的結果不記，下次會重查）
quote.lookup-cache-ttl=10m

# 證交所休市日表（排程用來跳過事先公布的休市日）。主機是 openapi.twse.com.tw，和行情不同，所以整個網址獨立設定；
# 查不到時（例如測試伺服器沒有這支 API）當成交易日照常排程
quote.holiday-url=${TWSE_HOLIDAY_URL:https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule}

# 背景更新行情（第 3 題）。時間都是台北時間；任何一項都可以用環境變數覆蓋，例如 QUOTE_REFRESH_ENABLED=false
quote.refresh.enabled=true
# 收盤 13:30、盤後最晚 13:33，實測官方約 13:50～14:02 公布，所以 13:40 開始查
quote.refresh.start-time=13:40
# 14:30 後放慢，應付官方延遲公布；15:40 後只剩今天還沒拿到資料、或還有持股收盤價待補查的市場繼續查
quote.refresh.slowdown-time=14:30
quote.refresh.end-time=15:40
# 15:40～23:40 每 20 分鐘一輪：官方延遲公布時，仍能在公布後一小時內更新；拿到資料就停
quote.refresh.late-end-time=23:40
quote.refresh.late-interval=20m
# 快速時段每輪約 60 秒，隨機加減 0～5 秒（非整數秒，避免看起來像固定排程的機器人）
quote.refresh.fast-interval=60s
quote.refresh.fast-jitter=5s
# 慢速時段、以及批次失敗改用逐檔時，每 10 分鐘一輪（逐檔請求數會隨持股數增加，太頻繁容易被擋）
quote.refresh.slow-interval=10m
# 逐檔查詢一次只送一個請求，請求之間隨機等 3.2～5.8 秒
quote.refresh.per-request-delay-min=3200ms
quote.refresh.per-request-delay-max=5800ms
# 被擋（403、429、回傳 HTML）時，該市場暫停 30 分鐘
quote.refresh.cooldown=30m
# 伺服器啟動時，今天沒有資料最多往前找 10 天（涵蓋春節長假）
quote.refresh.startup-lookback-days=10

# ===== 除權息（第 6 題）=====
# 主機沿用上面的 TWSE_BASE_URL、TPEX_BASE_URL，建立連線的上限沿用 quote.connect-timeout。
# 只在背景排程呼叫；一次查一整年的上市列表實測約 5 秒，行情的 5 秒不夠，所以等待回應的上限另外設 20 秒
quote.dividend-read-timeout=${DIVIDEND_READ_TIMEOUT:20s}
# 除權息同步排程（第 6 題）。時間都是台北時間；任何一項都可以用環境變數覆蓋，例如 DIVIDEND_SYNC_ENABLED=false
dividend.sync.enabled=true
# 每個交易日 07:30 重抓今年一次（休市日跳過）
dividend.sync.daily-time=07:30
# 每 30 分鐘檢查有沒有年份還沒有紀錄（例如補登了更早的交易）；檢查只讀資料庫，有缺才發請求
dividend.sync.backfill-check-interval=30m
# 行情或另一輪除權息正在跑時，啟動輪、每日輪延後 5 分鐘再試；被擋後冷卻沿用 quote.refresh.cooldown
dividend.sync.retry-delay=5m

# ===== 冪等鍵（第 6 題）=====
# 同一個 Idempotency-Key 的紀錄保留 24 小時；過期但還沒刪的照樣有效
idempotency.retention=24h
# 每小時刪一次過期紀錄；可用環境變數 IDEMPOTENCY_CLEANUP_ENABLED=false 關掉
idempotency.cleanup-enabled=true
idempotency.cleanup-interval=1h
