<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>持股清單 - 持股記帳</title>
	<style>
		table { border-collapse: collapse; }
		th, td { border: 1px solid #999; padding: 4px 10px; }
		td.num { text-align: right; }
		.error { color: #c00; }
		.message { color: #070; }
		.note { color: #888; }
		.hint { margin-left: 0.5em; }
		.hint.found { color: #036; font-weight: bold; }
		.hint.muted { color: #888; }
		.hint.error { color: #c00; }
		form.inline { display: inline; }
	</style>
</head>
<body>
	<h1>持股記帳</h1>
	<p><a th:href="@{/}">回首頁</a></p>

	<p class="message" th:if="${message}" th:text="${message}">已新增 2330</p>
	<p class="error" th:if="${errorMessage}" th:text="${errorMessage}">找不到這筆持股</p>

	<h2>新增持股</h2>
	<!-- 欄位用 text 而不是 number：檢查規則以伺服器為準，錯誤訊息統一顯示在表單上 -->
	<form th:action="@{/holdings}" th:object="${createForm}" method="post">
		<p>
			<label>股票代號 <input type="text" th:field="*{code}" maxlength="20" placeholder="例：2330" autocomplete="off"></label>
			<!-- 輸入代號時即時顯示名稱與市場（下方 script 填入）；只是提示，按下新增時伺服器仍會重新檢查 -->
			<span id="code-hint" class="hint" aria-live="polite" th:data-lookup-url="@{/holdings/lookup}"></span>
			<span class="error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">錯誤</span>
		</p>
		<p>
			<label>張數 <input type="text" th:field="*{lots}" inputmode="numeric" placeholder="1～999"></label>
			<span class="error" th:if="${#fields.hasErrors('lots')}" th:errors="*{lots}">錯誤</span>
		</p>
		<p>
			<label>買進價 <input type="text" th:field="*{buyPrice}" inputmode="decimal" placeholder="每股價格"></label>
			<span class="error" th:if="${#fields.hasErrors('buyPrice')}" th:errors="*{buyPrice}">錯誤</span>
		</p>
		<button type="submit">新增</button>
	</form>

	<h2>持股清單</h2>
	<p th:if="${#lists.isEmpty(holdings)}">目前沒有持股。</p>
	<table th:unless="${#lists.isEmpty(holdings)}">
		<thead>
			<tr><th>股票代號</th><th>名稱</th><th>市場</th><th>張數</th><th>買進價</th><th>收盤價</th><th>收盤價日期</th><th>操作</th></tr>
		</thead>
		<tbody>
			<tr th:each="h : ${holdings}">
				<td th:text="${h.code}">2330</td>
				<!-- 第 2 題時存的舊資料沒有名稱和市場（NULL），顯示「—」 -->
				<td th:text="${h.name} ?: '—'">台積電</td>
				<td th:text="${h.market} != null ? ${h.market.label} : '—'">上市</td>
				<td class="num" th:text="${h.lots}">1</td>
				<!-- 買進價固定顯示兩位小數、加千分位 -->
				<td class="num" th:text="${#numbers.formatDecimal(h.buyPrice, 1, 'COMMA', 2, 'POINT')}">1,000.00</td>
				<!-- 收盤價：沒有行情或從沒成交過顯示「未取得」，日期留空 -->
				<td class="num" th:if="${h.hasClosePrice()}"
						th:text="${#numbers.formatDecimal(h.closePrice, 1, 'COMMA', 2, 'POINT')}">2,030.00</td>
				<td th:unless="${h.hasClosePrice()}">未取得</td>
				<td>
					<span th:if="${h.hasClosePrice()}" th:text="${h.closeDate}">2026-11-23</span>
					<!-- 最近交易日沒成交：顯示的是更早一天的收盤價，提示使用者 -->
					<br th:if="${h.showsEarlierClose()}">
					<small class="note" th:if="${h.showsEarlierClose()}"
							th:text="|${h.latestTradeDate} 無成交，顯示 ${h.closeDate} 收盤價|">2026-11-24 無成交，顯示 2026-11-23 收盤價</small>
				</td>
				<td>
					<a th:href="@{/holdings/{id}/edit(id=${h.id})}">修改</a>
					<form class="inline" th:action="@{/holdings/{id}/delete(id=${h.id})}" method="post"
							th:attr="data-code=${h.code}"
							onsubmit="return confirm('確定要刪除 ' + this.dataset.code + ' 嗎？');">
						<button type="submit">刪除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>

	<script>
		// 輸入股票代號時，在欄位旁顯示名稱與市場。
		// 觸發時機：停止輸入 0.5 秒後，或游標離開欄位時；同一個代號不重複查（伺服器端另有 10 分鐘快取）。
		(function () {
			var input = document.getElementById('code');
			var hint = document.getElementById('code-hint');
			var lookupUrl = hint.dataset.lookupUrl;
			// 少於 4 個字不查：台股代號至少 4 碼，打到一半就查只是浪費官方請求
			var pattern = /^[A-Za-z0-9]{4,10}$/;
			var timer = null;
			var lastCode = null;
			var requestSeq = 0; // 只採用最後一次查詢的結果，較早送出但較晚回來的回應要丟掉

			function show(text, cssClass) {
				// 用 textContent 而不是 innerHTML：內容不會被當成 HTML 執行
				hint.textContent = text;
				hint.className = 'hint' + (cssClass ? ' ' + cssClass : '');
			}

			function lookup() {
				clearTimeout(timer);
				var code = input.value.trim().toUpperCase();
				if (code === lastCode) {
					return;
				}
				lastCode = code;
				if (!pattern.test(code)) {
					show('');
					return;
				}
				var seq = ++requestSeq;
				show('查詢中…', 'muted');
				fetch(lookupUrl + '?code=' + encodeURIComponent(code), { headers: { 'Accept': 'application/json' } })
					.then(function (res) {
						return res.json().then(function (body) { return { status: res.status, body: body }; });
					})
					.then(function (result) {
						if (seq !== requestSeq) {
							return;
						}
						if (result.status === 200) {
							show((result.body.name || '（名稱未知）') + '（' + result.body.market_label + '）', 'found');
						} else if (result.status === 404) {
							show('查無此股票代號', 'error');
						} else if (result.status === 409) {
							// 兩個市場都查到、無法判斷：顯示伺服器的訊息（請聯絡管理者），重試也不會好，所以不重設 lastCode
							show(result.body.error.message, 'error');
						} else {
							unavailable();
						}
					})
					.catch(function () {
						if (seq === requestSeq) {
							unavailable();
						}
					});
			}

			function unavailable() {
				show('暫時無法確認', 'muted');
				lastCode = null; // 連不上可能只是暫時的，讓使用者離開欄位時可以再查一次
			}

			input.addEventListener('input', function () {
				clearTimeout(timer);
				timer = setTimeout(lookup, 500);
			});
			input.addEventListener('blur', lookup);
		})();
	</script>
</body>
</html>
