<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>修改持股 - 持股記帳</title>
	<style>
		.error { color: #c00; }
	</style>
</head>
<body>
	<h1>修改持股</h1>

	<form th:action="@{/holdings/{id}(id=${holding.id})}" th:object="${updateForm}" method="post">
		<!-- 代號只顯示、不能改（和 App API 的 PUT 規格一致），所以不是輸入框 -->
		<p>股票代號：<strong id="code" th:text="${holding.code}">2330</strong>
			<!-- 名稱、市場在新增時由官方判斷，這裡也只顯示；舊資料沒有時顯示「—」 -->
			<span id="name" th:text="${holding.name} ?: '—'">台積電</span>
			（<span id="market" th:text="${holding.market} != null ? ${holding.market.label} : '—'">上市</span>）
		</p>
		<p>
			<label>張數 <input type="text" th:field="*{lots}" inputmode="numeric" placeholder="1～999"></label>
			<span class="error" th:if="${#fields.hasErrors('lots')}" th:errors="*{lots}">錯誤</span>
		</p>
		<p>
			<label>買進價 <input type="text" th:field="*{buyPrice}" inputmode="decimal" placeholder="每股價格"></label>
			<span class="error" th:if="${#fields.hasErrors('buyPrice')}" th:errors="*{buyPrice}">錯誤</span>
		</p>
		<button type="submit">儲存</button>
		<a th:href="@{/holdings}">取消</a>
	</form>
</body>
</html>
